[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fishsound"
version = "1.0.0"
description = "大黄鱼声信号分类与产卵发声检测：CNN14 迁移学习 + ONNX 部署 + INT8 混合精度量化"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yipeng Liang" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "soxr>=0.3",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "safetensors>=0.4",
    "onnx>=1.16",
    "onnxruntime>=1.17",
]

[project.optional-dependencies]
gpu = ["torch"]
# 仅 tutorials/ 早期教学脚本需要 librosa；核心包不依赖
tutorials = ["librosa>=0.10"]
dev = ["tqdm>=4.65", "pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
